<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabletop</title>
<link rel="stylesheet" href="/style.css">
<style>
  .home { max-width: 400px; margin: 12vh auto; padding: 0 16px; display: grid; gap: 14px; text-align: center; }
  .home p { font-family: var(--serif); font-size: 17px; margin: 18px 0 14px; }
  .home a { text-decoration: none; }
  .home button { width: 100%; padding: 14px 18px; font-size: 17px; font-weight: 700; flex-direction: column; gap: 2px; border-radius: 18px; }
  .home button span { display: block; font-size: 13px; color: var(--muted); font-weight: 400; }
</style>
</head>
<body>
<div class="home">
  <h1>Tabletop</h1>
  <p>Pick what this screen is for.</p>
  <a href="/play"><button class="soft">Player<span>Join with the room code on your phone</span></button></a>
  <a href="/tv"><button class="soft">TV<span>The big shared map everyone looks at</span></button></a>
  <a href="/dm"><button class="soft">DM<span>Run the game (needs the PIN)</span></button></a>
</div>
</body>
</html>
